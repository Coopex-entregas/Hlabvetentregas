name = "hlabvet-entregas"
main = "src/worker.js"
compatibility_date = "2026-10-02"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "hlabvet-entregas"
database_id = "COLE_AQUI_O_ID_DO_SEU_D1"

[triggers]
# Domingo, 00:05 em Fortaleza: fecha automaticamente a semana de segunda a sábado.
# Dia 1, 00:10 em Fortaleza: registra o fechamento do mês anterior.
crons = ["5 3 * * 0", "10 3 1 * *"]

[vars]
APP_TIMEZONE = "America/Fortaleza"
